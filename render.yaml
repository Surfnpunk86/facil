# Blueprint de Render para Fácil: web (API + app), cron de mensajes automáticos y PostgreSQL.
# Uso: Render → New → Blueprint → seleccionar este repositorio.
envVarGroups:
  - name: facil-config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false # ej. https://facil.onrender.com o el dominio propio
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_DEFAULT_RESTAURANT_SLUG
        sync: false
      - key: GW_ISSUER_ID
        sync: false
      - key: GW_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GW_PRIVATE_KEY
        sync: false

services:
  - type: web
    name: facil
    runtime: node
    region: virginia
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - fromGroup: facil-config
      - key: DATABASE_URL
        fromDatabase:
          name: facil-db
          property: connectionString

  - type: cron
    name: facil-automatizaciones
    runtime: node
    region: virginia
    plan: starter
    schedule: "0 14 * * *" # 9:00 a. m. en Bogotá (UTC-5)
    buildCommand: npm ci && npx prisma generate
    startCommand: node server/jobs/automations.js
    envVars:
      - fromGroup: facil-config
      - key: DATABASE_URL
        fromDatabase:
          name: facil-db
          property: connectionString

databases:
  - name: facil-db
    region: virginia
    plan: basic-256mb
    postgresMajorVersion: "16"
